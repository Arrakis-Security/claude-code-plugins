name: Public safe

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  public-safe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check nothing internal goes public
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUBLIC_SAFE_EXTRA_PATTERNS: ${{ secrets.PUBLIC_SAFE_EXTRA_PATTERNS }}
        run: .github/scripts/check-public-safe.sh "$BASE_SHA" "$HEAD_SHA"

  comment:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check nothing internal is in the comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          PUBLIC_SAFE_EXTRA_PATTERNS: ${{ secrets.PUBLIC_SAFE_EXTRA_PATTERNS }}
        run: .github/scripts/check-public-safe.sh
